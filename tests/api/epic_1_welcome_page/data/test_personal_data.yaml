# Passport ID (LP-42 valid, LP-43 invalid)

passport_id:
  valid:
    - id: "pid-v-01"
      value: "12345678945481"
      description: "digits only accepted"

    - id: "pid-v-02"
      value: "FG5R89H"
      description: "7 characters — 3 digits + 4 capitals — min boundary"

    - id: "pid-v-03"
      value: "4F5G8T9"
      description: "7 characters — 4 digits + 3 capitals — min boundary"

    - id: "pid-v-04"
      value: "1234567"
      description: "7 digits only — min boundary"

    - id: "pid-v-05"
      value: "12345678912345678985"
      description: "20 characters — max boundary"

    - id: "pid-v-06"
      value: "FHT456Y6"
      description: "8 characters — boundary"

    - id: "pid-v-07"
      value: "FHT456Y6HYERNF56OPE"
      description: "19 characters — boundary"

  invalid:
    - id: "pid-i-01"
      value: "ASDFGHJ"
      description: "capital letters only — no digits rejected"
      expected_error: "Must be between 7 and 20 characters long. Passport ID must contain at least 3 digits and can contain capital Latin letters."

    - id: "pid-i-02"
      value: "asdfjgk"
      description: "lowercase letters rejected"
      expected_error: "Must be between 7 and 20 characters long. Passport ID must contain at least 3 digits and can contain capital Latin letters."

    - id: "pid-i-03"
      value: "FG54HJ"
      description: "fewer than 3 digits rejected"
      expected_error: "Must be between 7 and 20 characters long. Passport ID must contain at least 3 digits and can contain capital Latin letters."

    - id: "pid-i-04"
      value: ""
      description: "empty field rejected"
      expected_error: "Must be between 7 and 20 characters long. Passport ID must contain at least 3 digits and can contain capital Latin letters."

    - id: "pid-i-05"
      value: "!@$%^&*()"
      description: "special characters rejected"
      expected_error: "Must be between 7 and 20 characters long. Passport ID must contain at least 3 digits and can contain capital Latin letters."

    - id: "pid-i-06"
      value: "FHT456"
      description: "6 characters — below min boundary"
      expected_error: "Must be between 7 and 20 characters long. Passport ID must contain at least 3 digits and can contain capital Latin letters."

    - id: "pid-i-07"
      value: "FHRT45G6Y6HYERNF56OPE"
      description: "21 characters — above max boundary"
      expected_error: "Must be between 7 and 20 characters long. Passport ID must contain at least 3 digits and can contain capital Latin letters."


# Birth Date (LP-48 valid, LP-46 invalid)

birth_date:
  valid:
    - id: "bd-v-01"
      value: "04\\05\\1997"
      description: "valid date manually entered DD\\MM\\YYYY"

    - id: "bd-v-02"
      value: "29\\02\\2020"
      description: "leap year Feb 29 accepted — 2020"

    - id: "bd-v-03"
      value: "29\\02\\2000"
      description: "leap year Feb 29 accepted — 2000"

    - id: "bd-v-04"
      value: "28\\02\\1998"
      description: "non-leap year Feb 28 accepted — 1998"

    - id: "bd-v-05"
      value: "28\\02\\2021"
      description: "non-leap year Feb 28 accepted — 2021"

  invalid:
    - id: "bd-i-01"
      value: "31\\03\\2027"
      description: "future date rejected"
      expected_error: "Year must be within the last 100 years."

    - id: "bd-i-02"
      value: "31\\03\\1925"
      description: "more than 100 years ago rejected"
      expected_error: "Year must be within the last 100 years."

    - id: "bd-i-03"
      value: "29\\02\\1999"
      description: "non-leap year Feb 29 rejected"
      expected_error: "Invalid date."

    - id: "bd-i-04"
      value: "32\\03\\2025"
      description: "invalid day 32 rejected"
      expected_error: "Invalid date format. Expected DD\\MM\\YYYY."

    - id: "bd-i-05"
      value: "00\\03\\2025"
      description: "invalid day 00 rejected"
      expected_error: "Invalid date format. Expected DD\\MM\\YYYY."

    - id: "bd-i-06"
      value: "05\\00\\2025"
      description: "invalid month 00 rejected"
      expected_error: "Invalid date format. Expected DD\\MM\\YYYY."

    - id: "bd-i-07"
      value: "05\\23\\2025"
      description: "invalid month 23 rejected"
      expected_error: "Invalid date format. Expected DD\\MM\\YYYY."

    - id: "bd-i-08"
      value: "05\\03\\958"
      description: "invalid year 3 digits rejected"
      expected_error: "Invalid date format. Expected DD\\MM\\YYYY."


