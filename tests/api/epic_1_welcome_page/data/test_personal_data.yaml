# First Name (LP-36 valid, LP-37 invalid)

first_name:
  valid:
    - id: "fn-v-01"
      value: "pavel"
      description: "lowercase Latin letters accepted"

    - id: "fn-v-02"
      value: "Pavel"
      description: "uppercase accepted"

    - id: "fn-v-03"
      value: "PaVel"
      description: "mixcase accepted"

    - id: "fn-v-04"
      value: "Pav-el"
      description: "hyphen in middle accepted"

    - id: "fn-v-05"
      value: "Pavel-Pavlov"
      description: "hyphen between words accepted"

    - id: "fn-v-06"
      value: "Pa"
      description: "2 characters — min boundary"

    - id: "fn-v-07"
      value: "Pavefafsvdbsbdsfasdfsadfsd"
      description: "30 characters — max boundary"

    - id: "fn-v-08"
      value: "Łódź"
      description: "Polish special characters accepted"

    - id: "fn-v-10"
      value: "qqqqqqqqqqqqqqqqqqqq                    eeeeeeeee"
      description: "20 chars + 20 spaces + 9 chars — internal spaces collapsed"

  invalid:
    - id: "fn-i-01"
      value: "!"
      description: "single special character — too short, length check fires first"
      expected_error: "Must be between 2 and 30 characters long."

    - id: "fn-i-02"
      value: "@"
      description: "single special character — too short, length check fires first"
      expected_error: "Must be between 2 and 30 characters long."

    - id: "fn-i-03"
      value: "Ł"
      description: "1 character — below min boundary"
      expected_error: "Must be between 2 and 30 characters long."

    - id: "fn-i-04"
      value: "ŁódźŁódźŁódźŁódźŁódźŁódźŁódźŁód"
      description: "31 characters — above max boundary"
      expected_error: "Must be between 2 and 30 characters long."

    - id: "fn-i-05"
      value: "  "
      description: "spaces only — leading/trailing spaces check fires first"
      expected_error: "Leading or trailing spaces are not allowed."

    - id: "fn-i-06"
      value: "-Łódź"
      description: "hyphen at beginning rejected"
      expected_error: "Special characters cannot be the first or last character."

    - id: "fn-i-07"
      value: "Łódź-"
      description: "hyphen at end rejected"
      expected_error: "Special characters cannot be the first or last character."

    - id: "fn-i-08"
      value: "ŁódźŁódźŁódźŁódźŁódźŁódźŁódźŁó   "
      description: "trailing spaces rejected"
      expected_error: "Leading or trailing spaces are not allowed."


